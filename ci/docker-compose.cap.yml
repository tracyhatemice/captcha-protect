networks:
    default:
services:
    valkey:
        image: valkey/valkey:9-alpine
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 2s
            timeout: 3s
            retries: 20
    cap:
        build:
            context: ${CAP_BUILD_CONTEXT:-https://github.com/tracyhatemice/cap.git#main}
            dockerfile: standalone/Dockerfile
        environment:
            ADMIN_KEY: ${CAP_ADMIN_KEY:-captcha-protect-ci-admin-key}
            REDIS_URL: redis://valkey:6379
            BASE_PATH: /cap
            ENABLE_ASSETS_SERVER: "true"
            WIDGET_VERSION: "0.1.57"
            WASM_VERSION: "0.0.7"
            HIDE_RATELIMIT_IP_WARNING: "true"
        depends_on:
            valkey:
                condition: service_healthy
    nginx:
        image: nginx:${NGINX_TAG}
        healthcheck:
            test: curl -fs http://localhost/healthz | grep -q OK || exit 1
            start_period: 5s
        volumes:
            - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    nginx2:
        image: nginx:${NGINX_TAG}
        healthcheck:
            test: curl -fs http://localhost/healthz | grep -q OK || exit 1
            start_period: 5s
        volumes:
            - ./conf/nginx/app2.conf:/etc/nginx/conf.d/default.conf:ro
    traefik:
        image: traefik:${TRAEFIK_TAG}
        command: >-
            --ping=true
            --log.level=INFO
            --entryPoints.http.address=:80
            --entryPoints.http.forwardedHeaders.insecure=true
            --providers.file.directory=/etc/traefik/dynamic
            --providers.file.watch=true
            --experimental.localPlugins.captcha-protect.moduleName=github.com/libops/captcha-protect
        volumes:
            - ./tmp/cap:/etc/traefik/dynamic:ro
            - ./cap/interaction-only.tmpl.html:/etc/traefik/templates/interaction-only.tmpl.html:ro
            - ./cap/click-to-verify.tmpl.html:/etc/traefik/templates/click-to-verify.tmpl.html:ro
            - ./../:/plugins-local/src/github.com/libops/captcha-protect:ro
        ports:
            - "${CAP_E2E_PORT:-8880}:80"
        healthcheck:
            test: traefik healthcheck --ping
            start_period: 5s
        depends_on:
            nginx:
                condition: service_healthy
            nginx2:
                condition: service_healthy
            cap:
                condition: service_started
    browser:
        build: ./cap/browser
        profiles: ["browser"]
        network_mode: "service:traefik"
        ipc: host
        init: true
