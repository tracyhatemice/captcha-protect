server {
    listen 80;
    listen  [::]:80;
    server_name  localhost nginx2;

    location /app2/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    location /app3/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
